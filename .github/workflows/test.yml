name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2025.1.4 pytest pytest-asyncio==0.24.0 pytest-socket pytest-aiohttp pytest-freezer

      - name: Check whitespace errors
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1 HEAD || [ "$(git rev-list --count HEAD)" = "1" ]
          fi

      - name: Compile sources
        run: python -m compileall -q custom_components tests

      - name: Run tests
        run: python -m pytest -q
